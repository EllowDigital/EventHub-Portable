<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tent Decor Expo 2026 | Event Hub</title>
    <style>
        /* CSS Variables for Modern Theming */
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --status-online: #10b981;
            --status-offline: #ef4444;
        }

        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1e293b, var(--bg-color));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
        }

        /* Network Status */
        .network-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--status-online);
            box-shadow: 0 0 8px var(--status-online);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .status-dot.offline {
            background-color: var(--status-offline);
            box-shadow: 0 0 8px var(--status-offline);
        }

        /* Audio Control */
        .audio-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .audio-btn:hover {
            background: var(--glass-bg);
            border-color: var(--text-muted);
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .expo-title {
            font-size: 1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .hub-title {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 3rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Routing Buttons */
        .route-container {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .route-btn {
            text-decoration: none;
            color: var(--text-main);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 1rem 2.5rem;
            border-radius: 12px;
            font-size: 1.125rem;
            font-weight: 500;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .route-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--accent);
            z-index: -1;
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .route-btn:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
        }

        .route-btn:hover::before {
            transform: scaleY(1);
        }

        /* Footer */
        footer {
            padding: 1.5rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-muted);
            border-top: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.8);
        }

        .ellowlabs {
            color: var(--text-main);
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hub-title {
                font-size: 2.5rem;
            }

            .route-container {
                flex-direction: column;
                width: 100%;
                max-width: 300px;
            }

            header {
                padding: 1rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="network-status" id="network-container">
            <div class="status-dot" id="network-dot"></div>
            <span id="network-text">Online</span>
        </div>

        <button class="audio-btn" id="audio-toggle">
            <svg id="icon-unmute" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24" style="display: block;">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"></path>
            </svg>
            <svg id="icon-mute" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24" style="display: none;">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z">
                </path>
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
            </svg>
            <span id="audio-text">Unmuted</span>
        </button>
    </header>

    <main>
        <div class="expo-title">Tent Decor Expo 2026</div>
        <h1 class="hub-title">EVENT HUB</h1>

        <div class="route-container">
            <a href="/check_in" class="route-btn">CHECK-IN</a>
            <a href="/network" class="route-btn">NETWORK</a>
            <a href="/register" class="route-btn">REGISTER</a>
        </div>
    </main>

    <footer>
        Powered by <span class="ellowlabs">EllowLabs</span>
    </footer>

    <script>
        // 1. Network Status Logic
        const networkText = document.getElementById('network-text');
        const networkDot = document.getElementById('network-dot');

        function updateNetworkStatus() {
            if (navigator.onLine) {
                networkText.textContent = 'Online';
                networkDot.classList.remove('offline');
            } else {
                networkText.textContent = 'Offline';
                networkDot.classList.add('offline');
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        // Set initial state
        updateNetworkStatus();

        // 2. Mute/Unmute Logic
        const audioBtn = document.getElementById('audio-toggle');
        const audioText = document.getElementById('audio-text');
        const iconMute = document.getElementById('icon-mute');
        const iconUnmute = document.getElementById('icon-unmute');
        let isMuted = false;

        audioBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            if (isMuted) {
                audioText.textContent = 'Muted';
                iconUnmute.style.display = 'none';
                iconMute.style.display = 'block';
            } else {
                audioText.textContent = 'Unmuted';
                iconUnmute.style.display = 'block';
                iconMute.style.display = 'none';
            }
            // Future feature: Insert actual audio context logic here
        });
    </script>
</body>

</html>
