<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Network & Device Stats - TDE UP 2026</title>
    <style>
      :root {
        --bg-dark: #0f1115;
        --surface: #1a1d24;
        --primary: #00d2ff;
        --success: #00e676;
        --warning: #ffbb33;
        --danger: #ff4444;
        --text: #ffffff;
        --text-dim: #aaaaaa;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background-color: var(--bg-dark);
        color: var(--text);
        margin: 0;
        padding: 25px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #333;
        padding-bottom: 15px;
        margin-bottom: 30px;
      }

      .btn-back {
        color: #aaa;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
        padding: 8px 14px;
        background: var(--surface);
        border-radius: 8px;
        transition: all 0.2s;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .btn-back:active {
        transform: scale(0.95);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }

      .card {
        background: var(--surface);
        padding: 25px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        transition: transform 0.3s;
      }
      .card:hover {
        transform: translateY(-5px);
        border-color: rgba(255, 255, 255, 0.1);
      }

      .card h3 {
        margin: 0 0 10px 0;
        color: var(--primary);
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .card p {
        margin: 0;
        font-size: 3rem;
        font-weight: 800;
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
      }

      .section-title {
        margin-bottom: 15px;
        font-size: 1.3rem;
        color: #fff;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .table-container {
        overflow-x: auto;
        background: var(--surface);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 18px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      }
      th {
        color: var(--text-dim);
        font-size: 0.85rem;
        text-transform: uppercase;
        background: rgba(0, 0, 0, 0.3);
        letter-spacing: 1px;
      }
      tr:last-child td {
        border-bottom: none;
      }

      /* Smooth row animations */
      tbody tr {
        transition: background 0.3s;
      }
      tbody tr:hover {
        background: rgba(255, 255, 255, 0.03);
      }

      .btn-edit {
        background: rgba(0, 210, 255, 0.1);
        color: var(--primary);
        border: 1px solid var(--primary);
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 0.85rem;
        transition: all 0.2s;
      }
      .btn-edit:hover {
        background: var(--primary);
        color: #000;
      }

      .status-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: bold;
      }
      .status-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .status-good {
        background: var(--success);
        box-shadow: 0 0 10px var(--success);
        animation: pulse 2s infinite;
      }
      .status-fair {
        background: var(--warning);
        box-shadow: 0 0 10px var(--warning);
      }
      .status-poor {
        background: var(--danger);
        box-shadow: 0 0 10px var(--danger);
      }
      .status-offline {
        background: #757575;
      }

      @keyframes pulse {
        0% {
          transform: scale(0.95);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.1);
          opacity: 1;
        }
        100% {
          transform: scale(0.95);
          opacity: 0.8;
        }
      }

      /* Advanced Latency Bar */
      .latency-container {
        width: 100px;
        background: #000;
        border-radius: 10px;
        overflow: hidden;
        height: 8px;
        margin-bottom: 5px;
      }
      .latency-bar {
        height: 100%;
        transition:
          width 0.3s ease,
          background 0.3s ease;
      }
      .latency-text {
        font-family: monospace;
        font-size: 0.85rem;
        color: #ccc;
      }

      @media (max-width: 600px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <a href="/" class="btn-back">⬅ Back to Hub</a>
      <h2 style="margin: 0">Dashboard & Telemetry</h2>
      <div class="status-wrapper">
        <span id="hub-status-text" style="font-size: 0.9rem; color: #aaa"
          >Syncing...</span
        >
        <span id="hub-status-dot" class="status-dot status-offline"></span>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h3>Kiosk Registrations</h3>
        <p id="tot-reg">0</p>
      </div>
      <div class="card">
        <h3>Total Scans (All Time)</h3>
        <p id="tot-scans">0</p>
      </div>
      <div class="card" style="border-bottom: 4px solid var(--success)">
        <h3 style="color: var(--success)">Today's Check-ins</h3>
        <p id="today-scans" style="color: var(--success)">0</p>
      </div>
    </div>

    <div class="section-title">
      Active Devices on Network
      <button
        class="btn-back"
        style="font-size: 0.8rem; background: transparent"
        onclick="fetchStats()"
      >
        ⟳ Refresh
      </button>
    </div>

    <div class="table-container">
      <table id="device-table">
        <thead>
          <tr>
            <th>Connection</th>
            <th>Device Name</th>
            <th>IP Address</th>
            <th>Network Latency</th>
            <th>Check-ins Today</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td
              colspan="6"
              style="text-align: center; color: #aaa; padding: 30px"
            >
              Loading network data...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script>
      async function fetchStats() {
        const start = performance.now();
        try {
          const res = await fetch("/api/network-data");
          const data = await res.json();

          const latency = Math.round(performance.now() - start);

          document.getElementById("hub-status-text").innerText = "Live";
          document.getElementById("hub-status-dot").className =
            "status-dot status-good";

          document.getElementById("tot-reg").innerText =
            data.global_stats.total_registrations;
          document.getElementById("tot-scans").innerText =
            data.global_stats.total_scans;
          document.getElementById("today-scans").innerText =
            data.global_stats.today_scans;

          const tbody = document.querySelector("#device-table tbody");
          tbody.innerHTML = "";

          if (Object.keys(data.active_devices).length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="6" style="text-align:center; color:#aaa; padding:30px;">No active devices found on the network. Make sure scanners have their screens open.</td></tr>';
            return;
          }

          for (const [ip, info] of Object.entries(data.active_devices)) {
            const tr = document.createElement("tr");

            const secondsAgo = Math.round(Date.now() / 1000 - info.last_seen);
            let statusClass = "status-good";
            let statusText = "Online";
            if (secondsAgo > 10) {
              statusClass = "status-fair";
              statusText = "Lagging";
            }
            if (secondsAgo > 25) {
              statusClass = "status-poor";
              statusText = "Dropping";
            }

            // Calculate latency bar width and color
            let barWidth = Math.min((latency / 500) * 100, 100);
            let barColor = "var(--success)";
            if (latency > 200) barColor = "var(--warning)";
            if (latency > 500) barColor = "var(--danger)";

            const scansToday = data.device_scans
              ? data.device_scans[info.name] || 0
              : 0;

            tr.innerHTML = `
                        <td>
                            <div class="status-wrapper">
                                <span class="status-dot ${statusClass}"></span> 
                                <span style="font-size: 0.85rem; color:#ccc;">${statusText} (${secondsAgo}s)</span>
                            </div>
                        </td>
                        <td><strong style="font-size: 1.05rem;">${info.name}</strong></td>
                        <td style="font-family: monospace; color: #888;">${ip}</td>
                        <td>
                            <div class="latency-container"><div class="latency-bar" style="width: ${barWidth}%; background: ${barColor};"></div></div>
                            <span class="latency-text">${latency} ms ping</span>
                        </td>
                        <td><strong style="font-size: 1.1rem; color: var(--primary);">${scansToday}</strong></td>
                        <td>
                            <button class="btn-edit" onclick="renameDevice('${ip}', '${info.name.replace(/'/g, "\'")}')">Edit Name</button>
                        </td>
                    `;
            tbody.appendChild(tr);
          }
        } catch (e) {
          document.getElementById("hub-status-text").innerText = "Hub Offline";
          document.getElementById("hub-status-dot").className =
            "status-dot status-poor";
        }
      }

      async function renameDevice(ip, oldName) {
        const newName = prompt(
          `Enter a new custom name for the device at ${ip}:`,
          oldName,
        );
        if (newName && newName.trim() !== "" && newName !== oldName) {
          try {
            await fetch("/api/device/rename", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ ip: ip, new_name: newName.trim() }),
            });
            fetchStats();
          } catch (err) {
            alert("Failed to rename device.");
          }
        }
      }

      setInterval(fetchStats, 3000);
      fetchStats();
    </script>
  </body>
</html>
