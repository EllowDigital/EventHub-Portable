<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Scanner - TDE UP 2026</title>
    <!-- HTML5 QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn-back {
            color: #aaaaaa;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 12px;
            background: #2a2a2a;
            border-radius: 6px;
        }

        /* Live Network Status Pill */
        .network-pill {
            font-size: 0.75rem;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            background: #2a2a2a;
            border: 1px solid #444;
        }
        .net-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .net-excellent { background: #00e676; box-shadow: 0 0 8px #00e676; }
        .net-fair { background: #ffbb33; box-shadow: 0 0 8px #ffbb33; }
        .net-poor { background: #ff4444; box-shadow: 0 0 8px #ff4444; }
        .net-offline { background: #757575; }

        /* Server-driven Testing Banner */
        #test-banner {
            width: 100%;
            max-width: 500px;
            background: #ff9800;
            color: #000;
            padding: 8px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: center;
            font-size: 0.9rem;
            display: none;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.4);
        }

        /* Scanner Container */
        .scanner-wrapper {
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333 !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background: #000;
        }

        #reader__dashboard_section_csr button, 
        #reader__dashboard_section_swap_link,
        #html5-qrcode-anchor-scan-type-change {
            display: none !important;
        }

        /* Samsung-style Zoom Bar Overlay */
        .zoom-toolbar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
        }

        .zoom-btn {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .zoom-btn:active {
            background: #00d2ff;
            color: #000;
        }

        #result-card {
            margin-top: 15px;
            padding: 15px 20px;
            width: 100%;
            max-width: 500px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            display: none;
            box-sizing: border-box;
        }

        .success { background-color: #00e676; color: #000; }
        .error { background-color: #ff1744; color: #fff; }
    </style>
</head>

<body>
    <div class="header">
        <a href="/" class="btn-back">⬅ Back</a>
        <h3 style="margin:0;">QR Check-in</h3>
        <!-- Live Network Quality Widget -->
        <div id="network-pill" class="network-pill">
            <span id="net-dot" class="net-dot net-offline"></span>
            <span id="net-text">Checking...</span>
        </div>
    </div>

    <!-- Auto-reflecting Server Test Mode Banner -->
    <div id="test-banner">🧪 TESTING MODE ACTIVE: Simulating Date <span id="banner-date"></span></div>

    <div class="scanner-wrapper">
        <div id="reader"></div>
        <!-- Samsung-Style Zoom Toolbar -->
        <div class="zoom-toolbar" id="zoom-controls" style="display:none;">
            <button class="zoom-btn" onclick="adjustZoom(1)">1x (Reset)</button>
            <button class="zoom-btn" onclick="adjustZoom(2)">2x Zoom</button>
            <button class="zoom-btn" onclick="adjustZoom(3)">3x Zoom</button>
        </div>
    </div>

    <div id="result-card"></div>

    <script>
        // --- AUDIO FEEDBACK ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(isSuccess) {
            try {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = isSuccess ? 'sine' : 'sawtooth';
                oscillator.frequency.value = isSuccess ? 1200 : 300;
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) { }
        }

        // --- LIVE NETWORK SPEED MONITOR ---
        async function checkNetworkQuality() {
            const dot = document.getElementById('net-dot');
            const text = document.getElementById('net-text');
            
            if (!navigator.onLine) {
                dot.className = "net-dot net-offline";
                text.textContent = "Disconnected";
                return;
            }

            const startTime = performance.now();
            try {
                await fetch('/favicon.ico?' + startTime, { method: 'HEAD', cache: 'no-store' });
                const duration = performance.now() - startTime;

                if (duration < 250) {
                    dot.className = "net-dot net-excellent";
                    text.textContent = "Excellent";
                } else if (duration < 700) {
                    dot.className = "net-dot net-fair";
                    text.textContent = "Fair";
                } else {
                    dot.className = "net-dot net-poor";
                    text.textContent = "Poor";
                }
            } catch (e) {
                dot.className = "net-dot net-poor";
                text.textContent = "Unstable";
            }
        }
        setInterval(checkNetworkQuality, 4000);
        window.addEventListener('online', checkNetworkQuality);
        window.addEventListener('error', checkNetworkQuality);
        checkNetworkQuality();

        // --- SYNC SERVER TESTING STATE ---
        async function syncServerStatus() {
            const banner = document.getElementById('test-banner');
            const bannerDate = document.getElementById('banner-date');
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                if (data.test_mode) {
                    bannerDate.textContent = data.test_date;
                    banner.style.display = 'block';
                } else {
                    banner.style.display = 'none';
                }
            } catch (e) {
                // Keep banner state if temporary network hiccup occurs
            }
        }
        setInterval(syncServerStatus, 3000);
        syncServerStatus();

        // --- CAMERA & ZOOM CONTROLLER ---
        let html5QrCode;
        const resultCard = document.getElementById('result-card');
        let isScanning = true;

        function showResult(message, isSuccess) {
            resultCard.textContent = message;
            resultCard.className = isSuccess ? 'success' : 'error';
            resultCard.style.display = 'block';
            playBeep(isSuccess);

            setTimeout(() => {
                resultCard.style.display = 'none';
                isScanning = true;
            }, 2500);
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (!isScanning) return;
            isScanning = false;

            let attendeeId = decodedText.trim();
            try {
                const parsedData = JSON.parse(decodedText);
                if (typeof parsedData === 'object' && parsedData !== null) {
                    attendeeId = parsedData.attendeeId || parsedData.attendee_id || parsedData.id || parsedData.uuid || decodedText;
                }
            } catch (e) {}

            // Send ID to Flask API (Server handles testing mode date automatically)
            fetch('/api/checkin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    attendee_id: attendeeId
                })
            })
            .then(response => response.json())
            .then(data => {
                showResult(data.message, data.status === 'success');
            })
            .catch(() => {
                showResult("Network Error. Cannot reach Hub.", false);
            });
        }

        async function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 20, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };

            try {
                await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
                setTimeout(() => {
                    try {
                        const videoTrack = html5QrCode.getRunningTrack();
                        if (videoTrack) {
                            const capabilities = videoTrack.getCapabilities();
                            if (capabilities && capabilities.zoom) {
                                document.getElementById('zoom-controls').style.display = 'flex';
                            }
                        }
                    } catch (err) {}
                }, 1000);
            } catch (err) {
                showResult("Camera permission denied or unavailable.", false);
            }
        }

        async function adjustZoom(level) {
            if (!html5QrCode) return;
            try {
                const videoTrack = html5QrCode.getRunningTrack();
                if (!videoTrack) return;
                const capabilities = videoTrack.getCapabilities();
                if (capabilities && capabilities.zoom) {
                    const minZoom = capabilities.zoom.min;
                    const maxZoom = capabilities.zoom.max;
                    let targetZoom = minZoom + (level - 1) * ((maxZoom - minZoom) / 2);
                    targetZoom = Math.min(Math.max(targetZoom, minZoom), maxZoom);
                    await videoTrack.applyConstraints({ advanced: [{ zoom: targetZoom }] });
                }
            } catch (e) {}
        }

        window.addEventListener('load', startScanner);
    </script>
</body>

</html>
