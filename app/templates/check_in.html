<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Scanner - TDE UP 2026</title>
    <!-- HTML5 QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-back {
            color: #aaaaaa;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 12px;
            background: #2a2a2a;
            border-radius: 6px;
        }

        /* Testing Mode Controls */
        .test-controls {
            width: 100%;
            max-width: 460px;
            background: #2a2a2a;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ff9800;
            box-sizing: border-box;
        }

        .test-controls select {
            padding: 6px 10px;
            background: #121212;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            font-weight: bold;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333 !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background: #000;
        }

        #reader button {
            padding: 10px;
            background: #00d2ff;
            color: black;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }

        #reader select {
            padding: 10px;
            background: #333;
            color: white;
            border-radius: 6px;
            border: 1px solid #555;
        }

        #result-card {
            margin-top: 20px;
            padding: 15px 20px;
            width: 100%;
            max-width: 460px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            display: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .success {
            background-color: #00e676;
            color: #000;
        }

        .error {
            background-color: #ff1744;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="header">
        <a href="/" class="btn-back">⬅ Back</a>
        <h3 style="margin:0;">QR Check-in</h3>
        <div style="width:60px;"></div>
    </div>

    <!-- Date Simulator for Testing -->
    <div class="test-controls">
        <span style="font-size: 0.9rem; color: #ff9800;">🧪 Simulator:</span>
        <select id="simulated-date">
            <option value="">Off (Real Time)</option>
            <option value="2026-08-30">Day 1 (30 Aug 2026)</option>
            <option value="2026-08-31">Day 2 (31 Aug 2026)</option>
            <option value="2026-09-01">Day 3 (1 Sept 2026)</option>
        </select>
    </div>

    <div id="reader"></div>
    <div id="result-card"></div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(isSuccess) {
            try {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = isSuccess ? 'sine' : 'sawtooth';
                oscillator.frequency.value = isSuccess ? 1200 : 300;
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) { }
        }

        const resultCard = document.getElementById('result-card');
        const dateSelector = document.getElementById('simulated-date');
        let isScanning = true;

        function showResult(message, isSuccess) {
            resultCard.textContent = message;
            resultCard.className = isSuccess ? 'success' : 'error';
            resultCard.style.display = 'block';
            playBeep(isSuccess);

            setTimeout(() => {
                resultCard.style.display = 'none';
                isScanning = true;
            }, 2500);
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (!isScanning) return;
            isScanning = false;

            const simulatedDate = dateSelector.value;
            let attendeeId = decodedText.trim();

            // Intelligent JSON Parsing: Extract attendeeId (camelCase) from QR payload
            try {
                const parsedData = JSON.parse(decodedText);
                if (typeof parsedData === 'object' && parsedData !== null) {
                    attendeeId = parsedData.attendeeId || parsedData.attendee_id || parsedData.id || parsedData.uuid || decodedText;
                }
            } catch (e) {
                // Fallback for plain text ID strings
            }

            // Send parsed ID to Flask API
            fetch('/api/checkin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    attendee_id: attendeeId,
                    simulated_date: simulatedDate
                })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        showResult(data.message, true);
                    } else {
                        showResult(data.message, false);
                    }
                })
                .catch(error => {
                    showResult("Network Error. Cannot reach Hub.", false);
                });
        }

        // Initialize Camera Engine - disabling picture upload strictly
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            {
                fps: 15,
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0,
                supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA] // Removes file upload button
            },
            false
        );
        html5QrcodeScanner.render(onScanSuccess, (error) => { });
    </script>
</body>

</html>
