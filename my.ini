# MySQL Server Instance Configuration File
# ----------------------------------------------------------------------
# FINAL OPTIMIZATION: 4GB RAM PC (Ultra-Fast Local + Universal LAN/Wi-Fi)

[client]
socket=0.0
port=3306

[mysql]
no-beep

[mysqld]
# ----------------------------------------------------------------------
# SERVER BASICS & NETWORKING (Zero Latency Profile)
# ----------------------------------------------------------------------
port=3306
mysqlx_port=33060

# ALLOW ALL CONNECTIONS (LAN, Wi-Fi, RJ45) on BOTH IPv4 & IPv6
# This completely eliminates the 2000ms Windows DNS timeout delay
bind-address=*

datadir="C:/ProgramData/MySQL/MySQL Server 8.4/Data"
secure-file-priv="C:/ProgramData/MySQL/MySQL Server 8.4/Uploads"
server-id=1

# ----------------------------------------------------------------------
# CHARACTER SET
# ----------------------------------------------------------------------
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci

# ----------------------------------------------------------------------
# CONNECTIONS & NETWORK TIMEOUTS (Optimized for Mobile Wi-Fi)
# ----------------------------------------------------------------------
max_connections=150
max_connect_errors=10000
thread_cache_size=50

# Drops dead mobile connections quickly so they don't hog server RAM
wait_timeout=600
interactive_timeout=600
net_read_timeout=60
net_write_timeout=120

# ----------------------------------------------------------------------
# MEMORY & BUFFERS (Strict limits for 4GB Host)
# ----------------------------------------------------------------------
max_allowed_packet=64M
tmp_table_size=32M
max_heap_table_size=32M
table_open_cache=2000
sort_buffer_size=1M
join_buffer_size=1M
read_buffer_size=256K
read_rnd_buffer_size=256K

temptable_max_ram=512M
internal_tmp_mem_storage_engine=TempTable

# ----------------------------------------------------------------------
# INNODB SETTINGS (Maximum Disk I/O Speed)
# ----------------------------------------------------------------------
default-storage-engine=InnoDB
innodb_file_per_table=1

# Skips double-buffering in Windows (Saves precious RAM)
innodb_flush_method=unbuffered

# Set to 2 to bypass aggressive disk writing (Massive speed boost)
innodb_flush_log_at_trx_commit=2

# MEMORY LIMIT: 1GB max for a 4GB system to prevent Windows pagefile lag
innodb_buffer_pool_size=1G
innodb_buffer_pool_instances=1

# InnoDB Logging & IO 
innodb_log_buffer_size=16M
innodb_redo_log_capacity=256M
innodb_io_capacity=500
innodb_io_capacity_max=1000

# ----------------------------------------------------------------------
# LOGGING (Minimal to save disk speed)
# ----------------------------------------------------------------------
log-output=FILE
general-log=0
general_log_file="SARWANX-DESKTOP.log"
log-error="SARWANX-DESKTOP.err"

# Disable binary logging: Massive disk I/O reduction for standalone servers
disable-log-bin 

slow_query_log=1
slow_query_log_file="SARWANX-DESKTOP-slow.log"
long_query_time=2

# ----------------------------------------------------------------------
# SYSTEM VARIABLES & SQL MODE
# ----------------------------------------------------------------------
lower_case_table_names=1
sql-mode="ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
authentication_policy=*,,
enable-named-pipe
shared-memory
shared-memory-base-name=0.0
socket=0.0
named-pipe-full-access-group=*everyone*
open_files_limit=4000